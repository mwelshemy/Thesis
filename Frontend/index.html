<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="assets/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Retrieving Using AI</title>
</head>
<body>
  <header class="github-header">
    <div class="logo">
      <span>Code Retrieving Using AI</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about/about.html">About</a>
      <a href="settings/settings.html">Settings</a>
    </nav>
  </header>
  <main>
    <section class="chat-container">
      <div class="chat-header">
        <span>AI Chat</span>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="message bot">
          <div class="avatar bot-avatar">
            <img src="Images/bot.png" alt="Bot Icon">
          </div>
          <div class="text">Hello! How can I help you retrieve code, convert code between languages, or suggest improvements?</div>
        </div>
      </div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Ask something about code, conversion, or improvement..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="assets/theme.js"></script>
  <script src="assets/script.js"></script>
</body>
</html>
