<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="assets/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeLingo</title>
</head>
<body>
  <header class="github-header">
    <div class="logo">
      <button id="sidebar-toggle" class="hamburger-btn" aria-label="Open sidebar">
        <span></span><span></span><span></span>
      </button>
      <span>CodeLingo</span>
    </div>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="about/about.html">About</a>
      <a href="settings/settings.html">Settings</a>
    </nav>
  </header>
  <div id="sidebar-container"></div>
  <main>
    <section class="chat-container">
      <div class="chat-header">
        <span>AI Chat</span>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="message bot">
          <div class="avatar bot-avatar">
            <img src="Images/bot.png" alt="Bot Icon">
          </div>
          <div class="text">
            Hello! How can I help you retrieve code, convert code between languages, or suggest improvements?
          </div>
        </div>
      </div>
      <form id="chat-form" autocomplete="off">
        <input type="text" id="chat-input" placeholder="Ask something about code, conversion, or improvement..." autocomplete="off" />
        <div class="form-actions">
          <div class="dropdown-upload">
            <button type="button" class="dropdown-btn">Upload <span>▼</span></button>
            <div class="dropdown-content">
              <label>
                <input type="file" id="file-upload" accept=".py,.js,.java,.cpp,.c,.cs,.txt,.ts,.go,.rb,.php,.html,.css,.json">
                <span>Single File</span>
              </label>
              <label>
                <input type="file" id="zip-upload" accept=".zip">
                <span>ZIP (Multiple Files)</span>
              </label>
            </div>
          </div>
          <button type="submit" id="send-btn">Send</button>
        </div>
        <span class="upload-filename" id="upload-filename"></span>
        <button class="upload-clear" id="upload-clear" style="display:none;">Clear</button>
      </form>
      <div id="upload-status" class="status" style="display:none;"></div>
      <form id="search-form" style="margin-top:20px;">
        <input type="text" id="search-input" placeholder="Search keyword..." />
        <button type="submit" id="search-btn">Search</button>
      </form>
      <pre id="search-results" class="search-results"></pre>
    </section>
  </main>
  <footer>
    &copy; 2025 CodeLingo &mdash; All rights reserved.
  </footer>
  <script src="assets/theme.js"></script>
  <script src="assets/script.js"></script>
</body>
</html>
