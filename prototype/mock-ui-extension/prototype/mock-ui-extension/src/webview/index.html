<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
            margin: 0;
            padding: 0;
        }

        #messages {
            height: 80vh;
            overflow-y: auto;
            padding: 10px;
        }

        .bubble {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
        }

        .user {
            background: #0078d7;
            align-self: flex-end;
        }

        .ai {
            background: #1f2937;
        }

        pre {
            background: #111827;
            padding: 8px;
            border-radius: 6px;
            margin-top: 5px;
        }

        #inputBar {
            display: flex;
            padding: 10px;
            background: #161b22;
        }

        #input {
            flex: 1;
            padding: 10px;
            border: none;
            background: #0d1117;
            color: white;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="messages"></div>
    <div id="inputBar">
        <input id="input" placeholder="Ask AI something..." />
        <button onclick="send()">Send</button>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        function appendBubble(text, who) {
            const div = document.createElement('div');
            div.className = 'bubble ' + who;

            const codeBlock = text.match(/```([\s\S]*?)```/);
            if (codeBlock) {
                const parts = text.split(/```[\s\S]*?```/);
                div.innerHTML = `<p>${parts[0]}</p><pre><code>${codeBlock[1]}</code></pre>`;
            } else {
                div.textContent = text;
            }

            document.getElementById('messages').appendChild(div);
        }

        function send() {
            const input = document.getElementById('input');
            vscode.postMessage({ type: 'userMessage', text: input.value });
            appendBubble(input.value, 'user');
            input.value = '';
        }

        window.addEventListener('message', (event) => {
            if (event.data.type === 'aiReply') {
                appendBubble(event.data.value, 'ai');
            }
        });
    </script>
</body>

</html>
